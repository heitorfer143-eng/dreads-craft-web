<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Code Studio</title><style>
:root{--bg:#0a0d12;--p:#111720;--p2:#0d1219;--l:#263241;--t:#eef3fa;--m:#96a3b5;--a:#5f97ff}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui;background:var(--bg);color:var(--t)}button,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:8px;align-items:center;padding:9px;background:var(--p);border-bottom:1px solid var(--l);flex-wrap:wrap}.brand{font-weight:800;margin-right:auto}.btn{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:8px 10px}.primary{background:var(--a);border:0;color:white}.status{font-size:12px;color:#ffc86b}.main{min-height:0;display:grid;grid-template-columns:34% 1fr}.chat{min-height:0;display:grid;grid-template-rows:1fr auto;background:var(--p);border-right:1px solid var(--l)}.msgs{overflow:auto;padding:12px}.msg{white-space:pre-wrap;background:var(--p2);border:1px solid var(--l);border-radius:11px;padding:9px 10px;margin-bottom:9px}.user{margin-left:16px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px;border-top:1px solid var(--l)}textarea{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:10px;resize:none}.composer textarea{height:60px}.ide{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr 42%}.tabs{display:flex;gap:5px;overflow:auto;padding:7px;background:var(--p)}.tab.active{border-color:var(--a)}.editorWrap{display:grid;grid-template-columns:auto 1fr;min-height:0;background:var(--p2)}.lines{padding:10px 8px;text-align:right;color:#59687d;border-right:1px solid var(--l);white-space:pre;font:13px/1.55 monospace;overflow:hidden}.editor{width:100%;height:100%;border:0;border-radius:0;outline:0;font:13px/1.55 monospace;white-space:pre}.bottom{min-height:0;border-top:1px solid var(--l);display:grid;grid-template-rows:auto 1fr}.btabs{display:flex;gap:5px;padding:7px;background:var(--p)}.pane{min-height:0;overflow:auto}.preview{width:100%;height:100%;border:0;background:white}.console{margin:0;padding:10px;background:#06090e;color:#d8e2ef;white-space:pre-wrap}.hidden{display:none}.light{--bg:#f6f8fc;--p:#fff;--p2:#eef2f7;--l:#d7dfea;--t:#152033;--m:#65738a;--a:#2869d8}.light .console{background:#edf1f6;color:#152033}@media(max-width:760px){.main{display:block;overflow:auto}.chat{height:42vh;border-right:0;border-bottom:1px solid var(--l)}.ide{height:100vh;grid-template-rows:auto 50vh 42vh}.top .btn{padding:7px 8px}.brand{width:100%}}
</style></head><body><div class="app"><div class="top"><div class="brand">⚡ AI Code Studio</div><span id="status" class="status">modo demo</span><button id="undo" class="btn">↶</button><button id="redo" class="btn">↷</button><button id="save" class="btn">Versão</button><button id="theme" class="btn">☀/☾</button><button id="run" class="btn primary">▶ Executar</button></div><div class="main"><section class="chat"><div id="msgs" class="msgs"></div><div class="composer"><textarea id="prompt" placeholder="Ex.: faça uma calculadora bonita"></textarea><button id="send" class="btn primary">Enviar</button></div></section><section class="ide"><div id="tabs" class="tabs"></div><div class="editorWrap"><div id="lines" class="lines">1</div><textarea id="editor" class="editor" spellcheck="false"></textarea></div><div class="bottom"><div class="btabs"><button class="btn pbtn" data-id="previewPane">Preview</button><button class="btn pbtn" data-id="consolePane">Console</button></div><div id="previewPane" class="pane"><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></div><pre id="consolePane" class="pane console hidden"></pre></div></section></div></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const starter={'index.html':'<main class="card"><h1>AI Code Studio</h1><p>Peça algo no chat.</p><button id="hello">Testar</button></main>','styles.css':'body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2ff}.card{background:white;padding:30px;border-radius:18px;text-align:center;box-shadow:0 15px 45px #2233  }button{padding:10px 14px;border:0;border-radius:9px;background:#2869d8;color:white}','script.js':'document.querySelector("#hello")?.addEventListener("click",()=>console.log("Funcionando!"));'};
let files=JSON.parse(localStorage.getItem('aics.files')||'null')||starter,active=localStorage.getItem('aics.active')||'index.html',hist=[],hidx=-1,busy=false,lastErr='',projectMode='web';
function persist(){localStorage.setItem('aics.files',JSON.stringify(files));localStorage.setItem('aics.active',active)}
function snapshot(){hist=hist.slice(0,hidx+1);hist.push({files:structuredClone(files),active});hidx=hist.length-1}
function restore(i){if(i<0||i>=hist.length)return;hidx=i;files=structuredClone(hist[i].files);active=hist[i].active;open(active)}
function renderTabs(){const t=$('#tabs');t.textContent='';Object.keys(files).forEach(p=>{const b=document.createElement('button');b.className='btn tab'+(p===active?' active':'');b.textContent=p;b.onclick=()=>open(p);t.appendChild(b)})}
function open(p){const ed=$('#editor');if(ed.dataset.ready==='1')files[active]=ed.value;active=p;ed.value=files[p]||'';ed.dataset.ready='1';persist();renderTabs();lineNums()}
function lineNums(){let n=$('#editor').value.split('\n').length;$('#lines').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
$('#editor').oninput=()=>{files[active]=$('#editor').value;persist();lineNums()};
function msg(k,t=''){const d=document.createElement('div');d.className='msg '+k;d.textContent=t;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d}
function log(t){$('#consolePane').textContent+=($('#consolePane').textContent?'\n':'')+t}
function srcdoc(){const bridge=`<script>['log','warn','error'].forEach(k=>{const o=console[k];console[k]=(...a)=>{parent.postMessage({aics:1,k,a},'*');o(...a)}});onerror=e=>parent.postMessage({aics:1,k:'runtime',a:[e]},'*');<\\/script>`;return `<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none';connect-src 'none';img-src data: blob:;style-src 'unsafe-inline';script-src 'unsafe-inline'"><style>${files['styles.css']||''}</style>${bridge}${files['index.html']||''}<script>${(files['script.js']||'').split('<'+'/script').join('<\\/script')}<\\/script>`}
async function run(){lastErr='';$('#consolePane').textContent='';$('#preview').srcdoc=srcdoc();await new Promise(r=>setTimeout(r,450));return lastErr}
window.onmessage=e=>{if(!e.data?.aics)return;log(e.data.k+': '+e.data.a.join(' '));if(e.data.k==='error'||e.data.k==='runtime')lastErr=e.data.a.join(' ')};
async function callAgent(prompt,attempt,error){const a=msg('ai',''),r=await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,files,attempt,error})});const rd=r.body.getReader(),dec=new TextDecoder();let buf='',path='';while(1){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;const ev=JSON.parse(line);if(ev.type==='chat')a.textContent+=ev.text;if(ev.type==='fileStart'){path=ev.path;files[path]='';if(active===path)$('#editor').value=''}if(ev.type==='file'){files[path]+=ev.text;if(active===path){$('#editor').value=files[path];lineNums()}}if(ev.type==='fileEnd'){persist();renderTabs()}if(ev.type==='mode'){projectMode=ev.mode;$('#status').textContent=(projectMode==='godot'?'🎮 Godot 4':'🌐 Web')+' • agente online'}}}}
async function send(){if(busy)return;const p=$('#prompt').value.trim();if(!p)return;busy=true;$('#send').disabled=true;msg('user',p);$('#prompt').value='';snapshot();try{let err='';for(let a=1;a<=3;a++){await callAgent(p,a,err);if(projectMode==='godot'){log('Projeto Godot 4 gerado. A execução headless ficará em um runner separado para manter a API key isolada.');break}err=await run();if(!err)break;if(a<3)msg('ai','Erro detectado. Tentando corrigir ('+(a+1)+'/3)…')}}catch(e){msg('ai','Erro: '+e.message)}finally{busy=false;$('#send').disabled=false;snapshot()}}
$('#send').onclick=send;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#run').onclick=run;$('#undo').onclick=()=>restore(hidx-1);$('#redo').onclick=()=>restore(hidx+1);$('#save').onclick=()=>{snapshot();msg('ai','Versão salva localmente.');};$('#theme').onclick=()=>document.body.classList.toggle('light');$$('.pbtn').forEach(b=>b.onclick=()=>['previewPane','consolePane'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.id)));
fetch('/api/health').then(r=>r.json()).then(x=>$('#status').textContent=x.ai?('IA real • '+x.model+' • web '+(x.network?'on':'off')):'modo demo • falta API key');open(active);snapshot();msg('ai','Pronto no celular. Pode pedir web ou Godot 4, por exemplo: “crie uma cena 3D no Godot com câmera, luz e personagem”.');run();
</script></body></html>
