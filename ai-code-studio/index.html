<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Code Studio Zero</title><style>:root{--bg:#080b10;--p:#111720;--p2:#0d1219;--l:#263241;--t:#eef3fa;--m:#96a3b5;--a:#5f97ff}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui;background:var(--bg);color:var(--t)}button,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:7px;align-items:center;padding:9px;background:var(--p);border-bottom:1px solid var(--l);flex-wrap:wrap}.brand{font-weight:800;margin-right:auto}.status{font-size:12px;color:#79e29b}.btn{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:8px 10px}.primary{background:var(--a);border:0;color:#fff}.main{min-height:0;display:grid;grid-template-columns:34% 1fr}.chat{min-height:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--p);border-right:1px solid var(--l)}.local{padding:8px 10px;border-bottom:1px solid var(--l);font-size:12px;color:var(--m)}.msgs{overflow:auto;padding:12px}.msg{white-space:pre-wrap;background:var(--p2);border:1px solid var(--l);border-radius:11px;padding:9px 10px;margin-bottom:9px}.user{margin-left:16px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px;border-top:1px solid var(--l)}textarea{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:10px;resize:none}.composer textarea{height:60px}.ide{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr 42%}.tabs,.btabs{display:flex;gap:5px;overflow:auto;padding:7px;background:var(--p)}.tab.active{border-color:var(--a)}.editorWrap{display:grid;grid-template-columns:auto 1fr;min-height:0;background:var(--p2)}.lines{padding:10px 8px;text-align:right;color:#59687d;border-right:1px solid var(--l);white-space:pre;font:13px/1.55 monospace;overflow:hidden}.editor{width:100%;height:100%;border:0;border-radius:0;outline:0;font:13px/1.55 monospace;white-space:pre}.bottom{min-height:0;border-top:1px solid var(--l);display:grid;grid-template-rows:auto 1fr}.pane{min-height:0;overflow:auto}.preview{width:100%;height:100%;border:0;background:white}.console{margin:0;padding:10px;background:#06090e;color:#d8e2ef;white-space:pre-wrap}.hidden{display:none}.light{--bg:#f6f8fc;--p:#fff;--p2:#eef2f7;--l:#d7dfea;--t:#152033;--m:#65738a;--a:#2869d8}@media(max-width:760px){.main{display:block;overflow:auto}.chat{height:45vh;border-right:0;border-bottom:1px solid var(--l)}.ide{height:100vh;grid-template-rows:auto 50vh 42vh}.brand{width:100%}}</style></head><body><div class="app"><header class="top"><b class="brand">⚡ AI Code Studio Zero</b><span id="status" class="status">R$ 0,00 • carregando</span><button id="storage" class="btn">Armazenamento</button><button id="undo" class="btn">↶</button><button id="redo" class="btn">↷</button><button id="theme" class="btn">☀/☾</button><button id="run" class="btn primary">▶ Executar</button></header><main class="main"><section class="chat"><div class="local">📱 Mobile-first: nenhum modelo de vários GB é baixado automaticamente. Projetos ficam no navegador.</div><div id="msgs" class="msgs"></div><div class="composer"><textarea id="prompt" placeholder="Ex.: faça uma calculadora bonita"></textarea><button id="send" class="btn primary">Enviar</button></div></section><section class="ide"><div id="tabs" class="tabs"></div><div class="editorWrap"><div id="lines" class="lines">1</div><textarea id="editor" class="editor" spellcheck="false"></textarea></div><div class="bottom"><div class="btabs"><button class="btn pbtn" data-id="previewPane">Preview</button><button class="btn pbtn" data-id="consolePane">Console</button></div><div id="previewPane" class="pane"><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></div><pre id="consolePane" class="pane console hidden"></pre></div></section></main></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const starter={'index.html':'<main><h1>AI Code Studio Zero</h1><p>Peça algo no chat.</p></main>','styles.css':'body{font-family:system-ui;padding:30px}','script.js':'console.log("Zero online")'};let files=JSON.parse(localStorage.getItem('aics.files')||'null')||starter,active=localStorage.getItem('aics.active')||'index.html',hist=[],hidx=-1,busy=false,lastErr='',projectMode='web';
function persist(){localStorage.setItem('aics.files',JSON.stringify(files));localStorage.setItem('aics.active',active)}function snapshot(){hist=hist.slice(0,hidx+1);hist.push({files:structuredClone(files),active});hidx=hist.length-1}function restore(i){if(i<0||i>=hist.length)return;hidx=i;files=structuredClone(hist[i].files);active=hist[i].active;open(active)}function renderTabs(){let t=$('#tabs');t.textContent='';for(const p of Object.keys(files)){let b=document.createElement('button');b.className='btn tab'+(p===active?' active':'');b.textContent=p;b.onclick=()=>open(p);t.append(b)}}function open(p){let e=$('#editor');if(e.dataset.ready)files[active]=e.value;active=p;e.value=files[p]||'';e.dataset.ready='1';persist();renderTabs();lines()}function lines(){let n=$('#editor').value.split('\n').length;$('#lines').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}$('#editor').oninput=()=>{files[active]=$('#editor').value;persist();lines()};function msg(k,t=''){let d=document.createElement('div');d.className='msg '+k;d.textContent=t;$('#msgs').append(d);$('#msgs').scrollTop=1e9;return d}function log(t){$('#consolePane').textContent+=($('#consolePane').textContent?'\n':'')+t}
function srcdoc(){let bridge=`<script>['log','warn','error'].forEach(k=>{let o=console[k];console[k]=(...a)=>{parent.postMessage({aics:1,k,a},'*');o(...a)}});onerror=e=>parent.postMessage({aics:1,k:'runtime',a:[e]},'*');<\\/script>`;return `<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none';connect-src 'none';img-src data: blob:;style-src 'unsafe-inline';script-src 'unsafe-inline'"><style>${files['styles.css']||''}</style>${bridge}${files['index.html']||''}<script>${(files['script.js']||'').split('<'+'/script').join('<\\/script')}<\\/script>`}async function run(){lastErr='';$('#consolePane').textContent='';if(projectMode==='godot'){log('Godot: arquivos gerados. Execução 3D não é feita no celular automaticamente.');return''}$('#preview').srcdoc=srcdoc();await new Promise(r=>setTimeout(r,400));return lastErr}onmessage=e=>{if(!e.data?.aics)return;log(e.data.k+': '+e.data.a.join(' '));if(['error','runtime'].includes(e.data.k))lastErr=e.data.a.join(' ')};
async function callAgent(prompt,attempt,error){let a=msg('ai',''),r=await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,files,attempt,error})});if(!r.ok)throw Error('Servidor '+r.status);let rd=r.body.getReader(),dec=new TextDecoder(),buf='',path='';while(1){let x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){let line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;let ev=JSON.parse(line);if(ev.type==='chat')a.textContent+=ev.text;if(ev.type==='fileStart'){path=ev.path;files[path]='';if(active===path)$('#editor').value=''}if(ev.type==='file'){files[path]+=ev.text;if(active===path){$('#editor').value=files[path];lines()}}if(ev.type==='fileEnd'){persist();renderTabs()}if(ev.type==='mode'){projectMode=ev.mode;$('#status').textContent='R$ 0,00 • '+(ev.mode==='godot'?'Godot':'Web')}}}}
async function send(){if(busy)return;let p=$('#prompt').value.trim();if(!p)return;busy=true;$('#send').disabled=true;msg('user',p);$('#prompt').value='';snapshot();try{let err='';for(let a=1;a<=3;a++){await callAgent(p,a,err);err=await run();if(!err||projectMode==='godot')break;if(a<3)msg('ai','Erro detectado; correção automática '+(a+1)+'/3…')}}catch(e){msg('ai','Erro: '+e.message)}finally{busy=false;$('#send').disabled=false;snapshot()}}
$('#send').onclick=send;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#run').onclick=run;$('#undo').onclick=()=>restore(hidx-1);$('#redo').onclick=()=>restore(hidx+1);$('#theme').onclick=()=>document.body.classList.toggle('light');$$('.pbtn').forEach(b=>b.onclick=()=>['previewPane','consolePane'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.id)));$('#storage').onclick=async()=>{let used='desconhecido';try{let x=await navigator.storage?.estimate();if(x)used=(x.usage/1048576).toFixed(1)+' MB'}catch{}msg('ai','Armazenamento usado pelo site: '+used+'. Nenhum modelo grande é baixado automaticamente. Para limpar projetos, use os dados do site no navegador.')};fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(x=>$('#status').textContent=(x.cost||'R$ 0,00')+' • '+x.model).catch(()=>$('#status').textContent='offline');open(active);snapshot();msg('ai','Modo Zero: sem API paga e sem baixar modelo de vários GB no seu PC/celular automaticamente.');run();
</script></body></html>
