<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Code Studio</title><body style="margin:0;background:#0a0d12;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh">Abrindo AI Code Studio…<script>(async()=>{try{const parts=await Promise.all(['static.1.b64','static.2.b64'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));const bin=Uint8Array.from(atob(parts.join('').trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.textContent='Falha ao carregar a demo: '+e}})()</script>
