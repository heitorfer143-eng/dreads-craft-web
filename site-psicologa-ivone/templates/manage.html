<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar agendamento</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login"><a class="brand" href="/">✿ Psicóloga Ivone</a><h1>Solicitação #{{b.id}}</h1><p>Data: {{b.day}} · {{b.time}}<br>Status: {{b.status}}</p>{% if b.status!='Cancelado' %}<button class="btn" id="cancel" data-id="{{b.id}}" data-token="{{token}}">Cancelar solicitação</button><p id="result" role="status"></p>{% endif %}<a href="/">Voltar ao site</a></main><script>document.querySelector('#cancel')?.addEventListener('click',async e=>{if(!confirm('Cancelar a solicitação?'))return;let b=e.currentTarget;let r=await fetch('/api/cancel/'+b.dataset.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:b.dataset.token})});let j=await r.json();document.querySelector('#result').textContent=j.message||j.error;if(r.ok)b.remove()})</script></body></html>
