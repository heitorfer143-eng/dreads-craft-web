name: Publicar Dreads Craft jogável

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/pages-game.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreads-craft-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar e exportar o jogo para navegador
        shell: bash
        env:
          HOME: /root
          XDG_CONFIG_HOME: /tmp/godot-config
          XDG_DATA_HOME: /root/.local/share
        run: |
          set -e
          mkdir -p assets/mobs/generated build/web
          godot --version
          godot --headless --script scripts/tools/extract_mob_pngs.gd
          godot --headless --script tests/asset_integrity.gd
          godot --headless --editor --quit
          godot --headless --check-only --script scripts/items.gd
          godot --headless --check-only --script scripts/save_game.gd
          godot --headless --check-only --script scripts/device_controls.gd
          godot --headless --check-only --script scripts/player.gd
          godot --headless --check-only --script scripts/world.gd
          godot --headless --check-only --script scripts/main.gd
          godot --headless --script tests/assets_smoke.gd
          godot --headless --script tests/smoke.gd
          godot --headless --script tests/lake_smoke.gd
          godot --headless --script tests/dungeon_smoke.gd
          godot --headless --export-release "Web" build/web/index.html
          cp assets/backgrounds/login_reference.jpg build/web/login_reference.jpg
          cp assets/backgrounds/dark_castles_generated.png build/web/login_bg.png
          test -s build/web/index.html
          ls -lh build/web

      - name: Guardar jogo exportado
        uses: actions/upload-artifact@v4
        with:
          name: dreads-craft-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch configurada no GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: v14-login-deploy-trigger
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Colocar o jogo exportado na raiz publicada
        uses: actions/download-artifact@v4
        with:
          name: dreads-craft-web
          path: site/

      - name: Publicar os arquivos do jogo
        working-directory: site
        shell: bash
        run: |
          set -e
          test -s index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "O jogo já está atualizado."
          else
            git commit -m "Publish playable Dreads Craft Web build"
            git push origin HEAD:v14-login-deploy-trigger
          fi
