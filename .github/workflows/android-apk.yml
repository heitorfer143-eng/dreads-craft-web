name: Build Android APK

on:
  push:
    branches: [main, update/generated-dungeon-art]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        shell: bash
        env:
          HOME: /root
          XDG_CONFIG_HOME: /tmp/godot-config
          XDG_DATA_HOME: /root/.local/share
          ANDROID_HOME: /usr/lib/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          set -e
          mkdir -p build/android
          mkdir -p assets/mobs/generated
          mkdir -p /tmp/godot-config/godot
          cat > /tmp/godot-config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_release.apk
          test -f /root/debug.keystore
          godot --version
          godot --headless --script scripts/tools/extract_mob_pngs.gd
          godot --headless --editor --quit
          godot --headless --check-only --script scripts/dungeon_system.gd
          godot --headless --check-only --script scripts/dungeon_art.gd
          godot --headless --check-only --script scripts/world.gd
          godot --headless --check-only --script scripts/main.gd
          godot --headless --script tests/smoke.gd
          godot --headless --script tests/lake_smoke.gd
          godot --headless --script tests/dungeon_smoke.gd
          godot --headless --export-release "Android" build/android/DreadsCraft.apk
          test -f build/android/DreadsCraft.apk
          ls -lh build/android/DreadsCraft.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DreadsCraft-v0.11-Android
          path: build/android/DreadsCraft.apk
          if-no-files-found: error
          retention-days: 14
